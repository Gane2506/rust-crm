[package]
name = "crm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Axum HTTP API server for the Rust CRM"

[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# chrono for test staff fixtures (pg_tests); the API itself does not
# handle datetimes directly.
chrono.workspace = true
# Domain types and shared utilities for the vertical slice.
crm-domain = { path = "../crm-domain", version = "0.1.0" }
crm-core = { path = "../crm-core", version = "0.1.0" }
# SQLx/PostgreSQL backend (02-DB-02); the pool type also names the
# Postgres-backed application state.
crm-db = { path = "../crm-db", version = "0.1.0" }
sqlx.workspace = true
# Stripe Checkout/webhook adapter (STRIPE-01): reqwest for the
# form-encoded Stripe API, hmac + subtle + hex for webhook signature
# verification, sha2 for the HMAC-SHA256 digest.
reqwest.workspace = true
hmac.workspace = true
hex.workspace = true
subtle.workspace = true
sha2.workspace = true
