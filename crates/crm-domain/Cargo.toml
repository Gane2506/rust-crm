# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "crm-domain"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Domain model and interfaces for the Rust CRM (task 01-FND-01)"
repository = "https://github.com/Gane2506/rust-crm"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid.workspace = true
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
