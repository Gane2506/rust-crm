# Ephemeral PostgreSQL for local development.
#
# Matches the Postgres 16 service CI's `test` job runs (same digest-pinned
# image there); keep the versions aligned. The database `crm_test` is
# created on startup and matches `DATABASE_URL` in `.env.example`.
#
# Usage: `docker compose up -d` (repo root), then run the test suite.
# Tear down with `docker compose down -v`.

services:
  postgres:
    image: postgres:16@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166 # postgres:16 (amd64)
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
